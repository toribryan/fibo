name: Bug report
description: Something in a fibo component is broken or looks wrong.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Button
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, what you saw instead, and how to reproduce it.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Storybook link
      description: A link to the story that shows the problem, if there is one.
      placeholder: https://fibo.toribryan.com/?path=/docs/base-components-actions-button--docs
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS 26
