name: Component request
description: Suggest a new part for fibo.
labels: [component request]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Tooltip
    validations:
      required: true
  - type: dropdown
    id: shelf
    attributes:
      label: Shelf
      description: Base components are the standard set; special components are playful and built for one moment.
      options:
        - Base components
        - Special components
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you use it for
      description: The situation it solves, and any prior art you like.
    validations:
      required: true
