name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  fragment:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A change to a shipped part needs a changes/*.md entry. Stories, tests
      # and 21st demos don't ship, so they don't count.
      - name: Shipped change has a fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only --diff-filter=d "$BASE"...HEAD)"
          shipped="$(echo "$files" | grep -E '^packages/ui/(src/|components\.meta\.json)' | grep -vE '\.(stories|test)\.tsx?$|/21st/|/__screenshots__/' || true)"
          fragment="$(echo "$files" | grep -E '^changes/.+\.md$' | grep -v '^changes/README\.md$' || true)"
          if [ -n "$shipped" ] && [ -z "$fragment" ]; then
            echo "This changes shipped parts but adds no changes/*.md entry:"
            echo "$shipped"
            echo "Add one (see changes/README.md) or label the PR 'no changelog'."
            exit 1
          fi
