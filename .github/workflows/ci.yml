name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Build runs before typecheck so the generated registry files exist.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests and story tests (render, play functions and axe checks)
      # all run in a real Chromium.
      - name: Install Chromium
        run: pnpm --filter storybook exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
