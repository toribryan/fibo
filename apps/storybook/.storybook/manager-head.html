<script>
  // Rewrite old links to their new ids before Storybook reads the address.
  // The shelves were renamed from Components and Niche, and the Theme
  // creator was archived (plans/001-theme-creator.md), so its links land on
  // Colors. Typography was a story before it became a docs page.
  ;(() => {
    const url = new URL(window.location.href)
    const path = url.searchParams.get("path")
    const moved = path
      ?.replace(
        /^\/(docs|story)\/(components|niche)-/,
        (_, kind, shelf) =>
          `/${kind}/${shelf === "niche" ? "special" : "base"}-components-`
      )
      .replace(
        /^\/docs\/foundations-theme-creator--docs$/,
        "/docs/foundations-colors--docs"
      )
      .replace(
        /^\/story\/foundations-typography--scale$/,
        "/docs/foundations-typography--docs"
      )
    if (!moved || moved === path) return
    url.searchParams.set("path", moved)
    window.history.replaceState(null, "", url)
  })()
</script>

<script>
  // On phones the menu button names the page by its path, such as
  // "Components/Button/Docs". Show just the page instead: "Button". The text
  // node is edited in place, so Storybook's own updates still land on it.
  ;(function () {
    function tidy() {
      var label = document.querySelector(
        'button[aria-label="Open navigation menu"] p'
      )
      var node = label && label.firstChild
      if (!node || node.nodeType !== 3) return
      var parts = node.nodeValue.split("/")
      if (parts.length < 2) return
      var docs = parts[parts.length - 1] === "Docs"
      var next = docs ? parts[parts.length - 2] : parts.slice(-2).join(" · ")
      if (node.nodeValue !== next) node.nodeValue = next
    }
    new MutationObserver(tidy).observe(document.documentElement, {
      subtree: true,
      childList: true,
      characterData: true,
    })
  })()
</script>

<script>
  // Vibe widens the nav to 244px so long story names fit. Only raises a
  // narrower saved width; a wider one the reader dragged to is kept.
  ;(function () {
    var MIN = 244
    try {
      var layout = JSON.parse(localStorage.getItem("storybook-layout"))
      if (layout && layout.resizerNav && layout.resizerNav.x >= MIN) return
      layout = layout || {}
      layout.resizerNav = { x: MIN, y: (layout.resizerNav || {}).y || 0 }
      localStorage.setItem("storybook-layout", JSON.stringify(layout))
    } catch (e) {}
  })()
</script>
